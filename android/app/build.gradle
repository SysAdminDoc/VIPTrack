plugins {
    id 'com.android.application'
}

def repositoryRoot = rootProject.projectDir.parentFile
def generatedWebAssets = layout.buildDirectory.dir('generated/viptrackWebAssets')

tasks.register('syncVipTrackWebAssets', Sync) {
    group = 'build setup'
    description = 'Bundles the lightweight VIPTrack mobile web shell into the APK.'
    into(generatedWebAssets)

    from(repositoryRoot) {
        include 'index.html'
        include 'sw.js'
        include 'manifest.json'
        include 'cesium-frame.html'
    }
    from(new File(repositoryRoot, 'assets')) {
        into 'assets'
        include 'viptrack-ui.css'
        include 'logo/**'
        include 'type_photos/**'
    }
    from(new File(repositoryRoot, 'data')) {
        into 'data'
        include 'aircraft/registrations.json'
        include 'aircraft/types.json'
        include 'aircraft/icao_types.json'
        include 'aircraft/ranges.json'
        include 'i18n/**'
        include 'overlays/**'
    }
    from(new File(repositoryRoot, 'plugins')) {
        into 'plugins'
        include 'manifest.json'
    }
    from(new File(repositoryRoot, 'workers')) {
        into 'workers'
        include 'registration-opfs-worker.js'
    }
}

tasks.register('verifyVipTrackWebAssets') {
    group = 'verification'
    description = 'Checks that the native shell contains the required mobile runtime without bulk media datasets.'
    dependsOn 'syncVipTrackWebAssets'
    doLast {
        def root = generatedWebAssets.get().asFile
        [
            'index.html',
            'sw.js',
            'manifest.json',
            'assets/viptrack-ui.css',
            'assets/logo/VIPTrack_Mark-128x128.png',
            'data/aircraft/registrations.json',
            'data/i18n/en.json',
            'workers/registration-opfs-worker.js'
        ].each { relativePath ->
            if (!new File(root, relativePath).isFile()) {
                throw new GradleException("Missing bundled web asset: ${relativePath}")
            }
        }
        if (new File(root, 'assets/aircraft_photos').exists()) {
            throw new GradleException('Bulk aircraft photos must not be packaged in the Android application.')
        }
        if (new File(root, 'data/faa').exists()) {
            throw new GradleException('FAA shards must remain an on-demand HTTPS dataset.')
        }
    }
}

android {
    namespace 'com.sysadmindoc.viptrack'
    compileSdk 36

    defaultConfig {
        applicationId 'com.sysadmindoc.viptrack'
        minSdk 24
        targetSdk 36
        versionCode 7
        versionName '0.4.3'
    }

    buildFeatures {
        buildConfig true
    }

    sourceSets {
        main {
            assets.srcDir(generatedWebAssets.get().asFile)
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }

    testOptions {
        unitTests.returnDefaultValues = false
    }
}

tasks.named('preBuild').configure {
    dependsOn 'verifyVipTrackWebAssets'
}

dependencies {
    implementation 'androidx.webkit:webkit:1.16.0' // Apache-2.0
    testImplementation 'junit:junit:4.13.2' // EPL-1.0
}
